<div class="planner-session {% if session.completed %}completed{% endif %}" id="session-{{ session.id }}">
  <div class="planner-session-top"><strong>{{ session.subject_ref.name }}</strong><small>{{ session.duration_minutes }} min</small></div>
  <p>{{ session.topic }}</p><small>{{ session.start_time.strftime("%H:%M") }} – {{ session.end_time.strftime("%H:%M") }}</small>
  <div class="planner-session-actions">
    <form method="post" action="{{ url_for('planner.toggle_weekly_session', session_id=session.id, view=active_view, week=weekly.start.isoformat(), month=monthly.start.strftime('%Y-%m'), year=yearly.year) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">{{ "Pending" if session.completed else "Complete" }}</button></form>
    <details><summary>Edit</summary><form method="post" action="{{ url_for('planner.edit_weekly_session', session_id=session.id, view=active_view) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Subject</label><select class="input" name="subject_id" required>{% for subject in subjects %}<option value="{{ subject.id }}" {% if subject.id == session.subject_id %}selected{% endif %}>{{ subject.name }}</option>{% endfor %}</select><label>Topic</label><input class="input" name="topic" value="{{ session.topic }}" maxlength="255" required><label>Date</label><input class="input" type="date" name="study_date" value="{{ session.study_date.isoformat() }}" required><div class="time-fields"><input class="input" type="time" name="start_time" value="{{ session.start_time.strftime('%H:%M') }}" required><input class="input" type="time" name="end_time" value="{{ session.end_time.strftime('%H:%M') }}" required></div><button class="button button-small" type="submit">Save</button></form></details>
    <form method="post" action="{{ url_for('planner.delete_weekly_session', session_id=session.id, view=active_view) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="danger-link" type="submit">Delete</button></form>
  </div>
</div>
